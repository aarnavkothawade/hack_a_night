{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<section class="empty-page">
  <div class="empty-icon danger">{{ icon('alert') }}</div>
  <p class="eyebrow">Error {{ status }}</p>
  <h1>Something went wrong</h1>
  <p class="lede">{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">{{ icon('arrow-right') }}Back to the vault</a>
</section>
{% endblock %}
